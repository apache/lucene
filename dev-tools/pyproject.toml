[project]
name = "dev-tools"
description = "Developer tool support"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  # git hooks and repository checks
  "prek==0.5.7",
  # validates github actions
  "zizmor==1.31.1",
  # validates github actions
  "actionlint-py==1.7.12.25",
  # validates bash
  "shellcheck-py==0.11.0.1",
  # validates markdown
  "rumdl==0.3.0",
  # validates python
  "ruff==0.17.2",
  # validates various
  "ast-grep-cli==0.51.0",
  # checks spelling
  "typos==1.51.1",
]

[tool.uv]
required-version = ">=0.9.27"
