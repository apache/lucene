[project]
name = "dev-tools"
description = "Developer tool support"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  # git hooks and repository checks
  "prek==0.5.3",
  # validates github actions
  "zizmor==1.30.1",
  # validates github actions
  "actionlint-py==1.7.12.25",
  # validates bash
  "shellcheck-py==0.11.0.1",
  # validates markdown
  "rumdl==0.2.76",
  # validates python
  "ruff==0.16.9",
  # validates various
  "ast-grep-cli==0.45.3",
  # checks spelling
  "typos==1.50.2",
]

[tool.uv]
required-version = ">=0.9.27"
