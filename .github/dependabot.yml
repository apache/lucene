version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - ".github/actions/eclint"
      - ".github/actions/prepare-for-build"
    open-pull-requests-limit: 25
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [dependencies, skip-changelog]
    groups:
      # codeql init/analyze must match exactly: validate each others versions
      codeql:
        patterns:
          - github/codeql-action/*
      # group patch/minor updates, typically no breaking changes
      actions:
        update-types:
          - patch
          - minor
    cooldown:
      default-days: 7

  # python dependencies in /dev-tools
  - package-ecosystem: uv
    directory: /dev-tools/
    open-pull-requests-limit: 25
    schedule:
      interval: monthly
    commit-message:
      prefix: build(deps)
    labels: [dependencies, skip-changelog]
    groups:
      # group patch/minor updates, typically no breaking changes
      python:
        update-types:
          - patch
          - minor
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: /
    open-pull-requests-limit: 25
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      prefix: deps(java)
    labels: [dependencies, skip-changelog]
    groups:
      # group patch/minor updates, typically no breaking changes
      java:
        update-types:
          - patch
          - minor
    cooldown:
      default-days: 7
