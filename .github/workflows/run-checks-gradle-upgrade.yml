name: "Run checks: gradle upgrade"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - 'main'
      - 'branch_10x'
    paths:
      - '.github/workflows/run-checks-gradle-upgrade.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-tools/build-infra/src/main/java/org/apache/lucene/gradle/*.java'

  push:
    branches:
      - 'main'
      - 'branch_10x'
    paths:
      - '.github/workflows/run-checks-gradle-upgrade.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-tools/build-infra/src/main/java/org/apache/lucene/gradle/*.java'

permissions: {}

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

jobs:
  gradleScriptBootstrapCheck:
    name: "Check gradle bootstrap script sanity on old JVMs."
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: 11
          java-package: jdk

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - shell: bash
        run: |
          set +e
          output=$(./gradlew 2>&1)
          if [[ "$output" == *"ERROR: java version must be"* ]]; then
            echo "Passed."
          else
            echo "Something is not right: gradlew command returned suspicious output or status code on JDK 11"
            echo -e "gradlew output echoed below:\n\n$output\n\n---(end of output)"
            exit 1
          fi

  gradleMirrorCheck:
    name: "Check gradle bootstrap from an intranet mirror (LUCENE_GRADLE_*_URL)."
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-for-build
        with:
          java-version: '25'
          use-cache: false

      - name: Build a local mirror from the official distribution and wrapper jar
        run: |
          set -e
          MIRROR="$RUNNER_TEMP/gradle-mirror"
          VERSION=$(grep -oP 'gradle-\K[^-]+(?=-bin\.zip)' gradle/wrapper/gradle-wrapper.properties)
          echo "Gradle version: $VERSION"
          mkdir -p "$MIRROR/$VERSION"
          curl -sSfL -o "$MIRROR/$VERSION/gradle-$VERSION-bin.zip" \
            "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
          curl -sSfL -o "$MIRROR/$VERSION/gradle-wrapper.jar" \
            "https://raw.githubusercontent.com/gradle/gradle/v$VERSION/gradle/wrapper/gradle-wrapper.jar"
          # A tampered copy for the negative test.
          cp -r "$MIRROR" "$MIRROR-bad"
          echo x >> "$MIRROR-bad/$VERSION/gradle-wrapper.jar"
          echo x >> "$MIRROR-bad/$VERSION/gradle-$VERSION-bin.zip"

      - name: Make the official download hosts unreachable
        run: echo "127.0.0.1 services.gradle.org raw.githubusercontent.com" | sudo tee -a /etc/hosts

      # The ${gradleVersion} placeholder below is expanded by GradleMirrorSetup, not by GitHub.
      - name: gradlew must bootstrap from the mirror only
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home
          LUCENE_GRADLE_WRAPPER_URL: file://${{ runner.temp }}/gradle-mirror/${gradleVersion}/gradle-wrapper.jar
          LUCENE_GRADLE_DISTRIBUTION_URL: file://${{ runner.temp }}/gradle-mirror/${gradleVersion}/gradle-${gradleVersion}-bin.zip
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          ./gradlew help

      - name: gradlew must reject a mirror with wrong checksums
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home-bad
          LUCENE_GRADLE_WRAPPER_URL: file://${{ runner.temp }}/gradle-mirror-bad/${gradleVersion}/gradle-wrapper.jar
          LUCENE_GRADLE_DISTRIBUTION_URL: file://${{ runner.temp }}/gradle-mirror-bad/${gradleVersion}/gradle-${gradleVersion}-bin.zip
        run: |
          set +e
          rm -f gradle/wrapper/gradle-wrapper.jar
          output=$(./gradlew --version 2>&1); status=$?
          if [ $status -ne 0 ] && [[ "$output" == *"does not match"* ]]; then
            echo "Passed (rejected as expected)."
          else
            echo "Expected a checksum failure, got status $status. gradlew output echoed below:"
            echo -e "\n$output\n\n---(end of output)"
            exit 1
          fi

      - name: gradlew must refuse LUCENE_GRADLE_VERIFY_CHECKSUMS=false in CI
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-user-home-bad
          LUCENE_GRADLE_VERIFY_CHECKSUMS: false
          LUCENE_GRADLE_WRAPPER_URL: file://${{ runner.temp }}/gradle-mirror-bad/${gradleVersion}/gradle-wrapper.jar
          LUCENE_GRADLE_DISTRIBUTION_URL: file://${{ runner.temp }}/gradle-mirror-bad/${gradleVersion}/gradle-${gradleVersion}-bin.zip
        run: |
          set +e
          test -n "$CI" || { echo "Expected the CI variable to be set."; exit 1; }
          output=$(./gradlew --version 2>&1); status=$?
          if [ $status -ne 0 ] && [[ "$output" == *"not allowed when the CI environment variable is set"* ]]; then
            echo "Passed (rejected as expected)."
          else
            echo "Expected a refusal, got status $status. gradlew output echoed below:"
            echo -e "\n$output\n\n---(end of output)"
            exit 1
          fi

  gradleWindowsSanityCheck:
    name: "Check gradlew help works on Windows."
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Correct git autocrlf on Windows
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-for-build
        with:
          java-version: '25'
          use-cache: false

      - run: ./gradlew help

  gradleSanityCheck:
    name: "Run tasks (java: ${{ matrix.java-version }}, alt-java: ${{ matrix.uses-alt-java }})"
    timeout-minutes: 30
    needs: [gradleScriptBootstrapCheck, gradleMirrorCheck, gradleWindowsSanityCheck]

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '25' ]
        uses-alt-java: [ true, false ]

    runs-on: ${{ matrix.os }}

    env:
      ALT_JAVA_DIR: /tmp/alt-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-for-build
        with:
          java-version: ${{ matrix.java-version }}
          use-cache: false

      - name: Set up RUNTIME_JAVA_HOME variable
        if: ${{ matrix.uses-alt-java }}
        run: |
          echo "All installed JDKs:"
          set | grep "JAVA"

          echo "Gradle's 'RUNTIME_JAVA_HOME' JDK:"
          RUNTIME_JAVA_HOME_VAR=JAVA_HOME_$(echo "$JAVA_VERSION" | grep -E --only "[0-9]+")_X64
          echo "${RUNTIME_JAVA_HOME_VAR}" points at "${!RUNTIME_JAVA_HOME_VAR}"

          # Copy the JDK from its default location to /tmp so that it appears different to gradle.
          rsync -av "${!RUNTIME_JAVA_HOME_VAR}/" "${ALT_JAVA_DIR}/"

          # This sets the environment variable and makes it available for subsequent job steps.
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
          echo "RUNTIME_JAVA_HOME=$ALT_JAVA_DIR" >> "$GITHUB_ENV"
        env:
          JAVA_VERSION: ${{ matrix.java-version }}

      - name: ./gradlew tidy
        run: |
          ./gradlew tidy
          if [ ! -z "$(git status --porcelain)" ]; then
          echo ":warning: **tidy left local checkout in modified state**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git reset --hard && git clean -xfd .
          fi

      - name: ./gradlew regenerate
        run: |
          # add this package for generateEmojiTokenizationTestChecksumLoad.
          sudo apt-get install libwww-perl
          ./gradlew regenerate -x regenerateUAX29URLEmailTokenizer --rerun-tasks
          if [ ! -z "$(git status --porcelain)" ]; then
            echo ":warning: **regenerate left local checkout in modified state**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git status --porcelain >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git reset --hard && git clean -xfd .
          fi

      - run: ./gradlew allOptions
      - run: ./gradlew helpWorkflow
      - run: ./gradlew licenses writeChecksums
      - run: ./gradlew check -x test
      - run: ./gradlew assembleRelease mavenToLocal
      - run: ./gradlew eclipse

      # Conserve resources: only run these in non-alt-java mode.
      - run: ./gradlew getGeoNames
        if: ${{ !matrix.uses-alt-java }}
