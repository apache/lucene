name: "Run special checks: native vector integration"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - '*'
    paths:
      - '.github/workflows/run-special-checks-core.yml'
      - '.github/actions/prepare-for-build/**'
      - 'build-tools/build-infra/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'build-options.properties'
      - 'gradlew'
      - 'gradle/**'
      - 'versions.lock'
      - 'lucene/build.gradle'
      - 'lucene/core/build.gradle'
      - 'lucene/core/src/**/vectorization/**'
      - 'lucene/core/src/java/org/apache/lucene/util/Constants.java'
      - 'lucene/core/src/test-native/**'
      - 'lucene/misc/src/c/**'
      - 'lucene/test-framework/src/java/org/apache/lucene/tests/util/LuceneTestCase.java'

  push:
    branches:
      - 'main'
      - 'branch_10x'
    paths:
      - '.github/workflows/run-special-checks-core.yml'
      - '.github/actions/prepare-for-build/**'
      - 'build-tools/build-infra/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'build-options.properties'
      - 'gradlew'
      - 'gradle/**'
      - 'versions.lock'
      - 'lucene/build.gradle'
      - 'lucene/core/build.gradle'
      - 'lucene/core/src/**/vectorization/**'
      - 'lucene/core/src/java/org/apache/lucene/util/Constants.java'
      - 'lucene/core/src/test-native/**'
      - 'lucene/misc/src/c/**'
      - 'lucene/test-framework/src/java/org/apache/lucene/tests/util/LuceneTestCase.java'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  native-vector-tests:
    name: Native vector integration (ubuntu-26.04-arm)
    timeout-minutes: 15
    # The scalar fixture checks FFM integration without architecture-specific kernels.
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout Lucene
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Lucene workspace
        uses: ./.github/actions/prepare-for-build

      - name: Build and test native vector libraries
        run: >
          ./gradlew :lucene:core:test
          --tests org.apache.lucene.internal.vectorization.TestNativeVectorLibrary
          -Ptests.nativevector.run=true
